<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3rd Year Chemistry Resource System</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* =========================================================
       BOTTOM-LEFT ADMIN / CREATOR PANEL
       ========================================================= */

    .bottom-left-panel {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 9999;

      width: 270px;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }


    /* =========================================================
       ADD RESOURCE BUTTON
       ========================================================= */

    .add-resource-btn {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 11px 14px;

      border: 1px solid rgba(255, 122, 24, 0.68);
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 122, 24, 0.95),
          rgba(223, 65, 50, 0.95)
        );

      color: #ffffff;

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.3),
        0 0 18px rgba(255, 122, 24, 0.10);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .add-resource-btn:hover {
      transform: translateY(-3px);

      border-color: rgba(255, 255, 255, 0.9);

      background:
        linear-gradient(
          135deg,
          rgba(255, 154, 72, 1),
          rgba(238, 89, 73, 1)
        );

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.4),
        0 0 25px rgba(255, 122, 24, 0.18);
    }

    .add-resource-icon {
      font-size: 15px;
      line-height: 1;
    }


    /* =========================================================
       CREATOR CARD
       ========================================================= */

    .creator-card {
      width: 100%;
      box-sizing: border-box;

      padding: 14px 16px;

      background: rgba(24, 24, 24, 0.94);

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(255, 122, 24, 0.08);

      color: #ffffff;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .creator-card:hover {
      transform: translateY(-3px);

      border-color: rgba(255, 122, 24, 0.65);

      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(255, 122, 24, 0.14);
    }

    .creator-label {
      display: block;

      margin-bottom: 3px;

      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;

      color: #ff9a48;
    }

    .creator-name {
      margin: 0;

      font-size: 17px;
      font-weight: 700;

      color: #ffffff;
    }

    .creator-project {
      margin: 4px 0 11px;

      font-size: 11px;
      line-height: 1.4;

      color: rgba(255, 255, 255, 0.62);
    }

    .creator-portfolio {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 10px;

      border: 1px solid rgba(255, 122, 24, 0.42);
      border-radius: 8px;

      background: rgba(255, 122, 24, 0.10);

      color: #ff9a48;

      text-decoration: none;

      font-size: 11px;
      font-weight: 600;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .creator-portfolio:hover {
      background: rgba(255, 122, 24, 0.18);

      border-color: rgba(255, 122, 24, 0.72);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .bottom-left-panel {
        left: 12px;
        bottom: 12px;

        width: 230px;
      }

      .add-resource-btn {
        padding: 9px 11px;
        font-size: 11px;
      }

      .creator-card {
        padding: 11px 13px;
      }

      .creator-name {
        font-size: 15px;
      }

      .creator-project {
        margin-bottom: 8px;
        font-size: 10px;
      }

      .creator-portfolio {
        padding: 5px 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       LOADING SCREEN
       ======================================================= -->

  <div id="loader-overlay">

    <div class="prologue-copy" aria-hidden="true">
      <span class="eyebrow">CHEMISTRY 53</span>
      <p>Making room for curious minds.</p>
    </div>

    <div class="prologue-stage" aria-hidden="true">
      <div class="prologue-wall">
        <span>WELCOME</span>
      </div>

      <div class="prologue-boy">
        <div class="boy-hair"></div>
        <div class="boy-head"><span class="boy-face">•ᴗ•</span></div>
        <div class="boy-neck"></div>
        <div class="boy-body"></div>
        <div class="boy-arm boy-arm-left"></div>
        <div class="boy-arm boy-arm-right"></div>
        <div class="boy-leg boy-leg-left"></div>
        <div class="boy-leg boy-leg-right"></div>
      </div>
    </div>

    <button class="skip-prologue" id="skip-prologue" type="button">
      Skip intro <span>→</span>
    </button>

  </div>


  <!-- =======================================================
       BOTTOM-LEFT PANEL
       ======================================================= -->

  <div class="bottom-left-panel">

    <!-- UPLOAD RESOURCE BUTTON -->

    <a
      href="code-generator.html"
      class="add-resource-btn"
    >

      <span class="add-resource-icon">
        ＋
      </span>

      <span>
        Upload Resource
      </span>

    </a>


    <!-- CREATOR INFORMATION -->

    <section class="creator-card">

      <span class="creator-label">
        Created by
      </span>

      <h2 class="creator-name">
        Farabi · Chemistry 53
      </h2>

      <p class="creator-project">
        3rd Year Chemistry Resource System
      </p>

      <a
        class="creator-portfolio"
        href="https://smkfarabi-stack.github.io/my-portfolio/"
        target="_blank"
        rel="noopener noreferrer"
      >
        ↗ View Portfolio
      </a>

    </section>

  </div>


  <!-- =======================================================
       MAIN APPLICATION
       ======================================================= -->

  <main
    id="app-root"
    style="
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    "
  ></main>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script src="js/syllabus-data.js"></script>

  <script src="js/resources-import.js"></script>

  <script src="js/resources.js"></script>

  <script src="js/code-generator.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
